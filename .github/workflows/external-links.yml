name: External references
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-external-links.mjs
